# WineBox OAT (pre-release testing) nginx configuration
# Place in /etc/nginx/sites-available/winebox and symlink to sites-enabled
# Domains:
#   - oat.winebox.app          → main wine app (port 8000)
#   - oatadmin.winebox.app     → admin panel    (port 8001, IP-restricted)
#
# Admin allowlist (allow ...; deny all;) is rendered from
# deploy/winebox-admin.toml at deploy time — every `# __ADMIN_ALLOWLIST__`
# placeholder below is substituted by deploy.common.render_nginx_config.

# Hide nginx version from response headers (matches production).
server_tokens off;

upstream winebox_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream winebox_admin {
    server 127.0.0.1:8001;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name oat.winebox.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://oat.winebox.app$request_uri;
    }
}

# HTTPS server for OAT app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oat.winebox.app;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/oat.winebox.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oat.winebox.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/oat.winebox.app/chain.pem;

    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/winebox-oat.access.log;
    error_log /var/log/nginx/winebox-oat.error.log;

    # Max upload size (for wine label images)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # HTML pages - short cache so deployments take effect quickly
    location = /static/index.html {
        alias /opt/winebox/static/index.html;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Static assets (CSS, JS, images, fonts) - long cache with versioned URLs
    # Re-emit HSTS — `add_header` in a `location` block overrides parent ones.
    location /static/ {
        alias /opt/winebox/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Favicon
    location = /favicon.ico {
        alias /opt/winebox/static/logos/favicon.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Admin panel — IP restricted (matches prod hardening). Allowlist is
    # rendered from deploy/winebox-admin.toml [oat] at deploy time.
    location /admin {
        # __ADMIN_ALLOWLIST__

        proxy_pass http://winebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # API and application
    location / {
        proxy_pass http://winebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint (no logging)
    location /health {
        proxy_pass http://winebox_app/health;
        access_log off;
    }
}

# =============================================================================
# oatadmin.winebox.app — standalone admin panel (winebox.admin.main:app)
# =============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name oatadmin.winebox.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://oatadmin.winebox.app$request_uri;
    }
}

# HTTPS server for admin panel — entire host is IP-restricted
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oatadmin.winebox.app;

    # Allowlist applies to the whole host. Rendered from
    # deploy/winebox-admin.toml [oat] at deploy time.
    # __ADMIN_ALLOWLIST__

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/oatadmin.winebox.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oatadmin.winebox.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/oatadmin.winebox.app/chain.pem;

    # SSL configuration (matches oat.winebox.app)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging — separate files so allowlist denials are easy to spot.
    access_log /var/log/nginx/winebox-oat-admin.access.log;
    error_log /var/log/nginx/winebox-oat-admin.error.log;

    # Admin uploads (label re-scans, future export downloads) — same cap.
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Admin app proxies everything to the admin uvicorn worker.
    location / {
        proxy_pass http://winebox_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health endpoint (no access log)
    location = /health {
        proxy_pass http://winebox_admin/health;
        access_log off;
    }
}
