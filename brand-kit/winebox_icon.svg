<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="wineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B3A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A1D1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A227;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGradient">
      <stop offset="0%" style="stop-color:#FEFEF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F1E8;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" fill="url(#bgGradient)"/>
  
  <!-- Wine bottle icon (centered and larger) -->
  <g transform="translate(60, 60)">
    <!-- Bottle body -->
    <path d="M -12 -8 Q -16 -8 -16 2 L -16 28 Q -16 35 -8 35 L 8 35 Q 16 35 16 28 L 16 2 Q 16 -8 12 -8 Z" 
          fill="url(#wineGradient)" stroke="#3D1D1D" stroke-width="1.2"/>
    
    <!-- Wine liquid -->
    <ellipse cx="0" cy="28" rx="14" ry="2" fill="#8B3A3A" opacity="0.6"/>
    <path d="M -14 8 L -14 24 Q -14 30 -8 30 L 8 30 Q 14 30 14 24 L 14 8 Z" 
          fill="#D4A574" opacity="0.5"/>
    
    <!-- Bottle neck -->
    <rect x="-4" y="-18" width="8" height="12" fill="url(#wineGradient)" stroke="#3D1D1D" stroke-width="1"/>
    
    <!-- Bottle top/cork -->
    <rect x="-6" y="-24" width="12" height="6" rx="1.5" fill="#C4A469" stroke="#8B7355" stroke-width="1"/>
    <rect x="-5" y="-26" width="10" height="2" fill="#D4AF37" stroke="#C9A227" stroke-width="0.5"/>
    
    <!-- Highlight -->
    <ellipse cx="-6" cy="10" rx="2" ry="8" fill="white" opacity="0.2"/>
    
    <!-- Decorative accent line -->
    <line x1="-14" y1="18" x2="14" y2="18" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>