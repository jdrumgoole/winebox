<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients for wine color depth -->
  <defs>
    <linearGradient id="wineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B3A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A1D1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A227;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Wine bottle icon -->
  <g id="bottle">
    <!-- Bottle body -->
    <path d="M 25 35 Q 20 35 20 45 L 20 85 Q 20 95 30 95 L 50 95 Q 60 95 60 85 L 60 45 Q 60 35 55 35 Z" 
          fill="url(#wineGradient)" stroke="#3D1D1D" stroke-width="1.5"/>
    
    <!-- Wine liquid inside -->
    <ellipse cx="40" cy="85" rx="18" ry="3" fill="#8B3A3A" opacity="0.6"/>
    <path d="M 22 60 L 22 82 Q 22 88 30 88 L 50 88 Q 58 88 58 82 L 58 60 Z" 
          fill="#D4A574" opacity="0.5"/>
    
    <!-- Bottle neck -->
    <rect x="35" y="18" width="10" height="17" fill="url(#wineGradient)" stroke="#3D1D1D" stroke-width="1"/>
    
    <!-- Bottle top/cork area -->
    <rect x="32" y="12" width="16" height="8" rx="2" fill="#C4A469" stroke="#8B7355" stroke-width="1"/>
    <rect x="33" y="10" width="14" height="3" fill="#D4AF37" stroke="#C9A227" stroke-width="0.5"/>
    
    <!-- Highlight on bottle for dimension -->
    <ellipse cx="28" cy="50" rx="3" ry="12" fill="white" opacity="0.15"/>
  </g>
  
  <!-- Text: WineBox -->
  <text x="85" y="60" font-family="Georgia, serif" font-size="48" font-weight="bold" 
        fill="#5A1D1D" letter-spacing="-1">WineBox</text>
  
  <!-- Decorative line and accent -->
  <g id="accent">
    <line x1="85" y1="70" x2="220" y2="70" stroke="url(#goldAccent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="87" cy="70" r="3" fill="#D4AF37"/>
    <circle cx="218" cy="70" r="3" fill="#D4AF37"/>
  </g>
  
  <!-- Tagline -->
  <text x="85" y="95" font-family="Georgia, serif" font-size="14" fill="#8B3A3A" 
        font-style="italic" letter-spacing="1">Curate Your Collection</text>
</svg>