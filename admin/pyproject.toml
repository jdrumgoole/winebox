[project]
name = "winebox-admin"
version = "0.1.0"
description = "WineBox Admin Panel - Standalone admin application"
requires-python = ">=3.11"
dependencies = [
    "winebox",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "slowapi>=0.1.9",
]

[project.scripts]
winebox-admin-server = "admin_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
