name: Nightly OAT Deploy & Test

on:
  schedule:
    # Run at 2:17 AM UTC every night (avoid :00/:30 stampede)
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deploy, only run tests"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy latest to OAT
    if: ${{ !inputs.skip_deploy && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, oat]
    environment: oat-deploy

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Deploy to OAT (loopback)
        env:
          WINEBOX_MONGODB_URL: ${{ secrets.WINEBOX_OAT_MONGODB_URL }}
          WINEBOX_SECRET_KEY: ${{ secrets.WINEBOX_SECRET_KEY }}
          WINEBOX_ANTHROPIC_API_KEY: ${{ secrets.WINEBOX_ANTHROPIC_API_KEY }}
          WINEBOX_POSTHOG_API_KEY: ${{ secrets.WINEBOX_POSTHOG_API_KEY }}
          WINEBOX_POSTHOG_ENABLED: ${{ secrets.WINEBOX_POSTHOG_ENABLED }}
          WINEBOX_DO_TOKEN: ${{ secrets.WINEBOX_DO_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          WINEBOX_TEST_USER: ${{ secrets.WINEBOX_TEST_USER }}
          WINEBOX_TEST_PASSWORD: ${{ secrets.WINEBOX_TEST_PASSWORD }}
        run: |
          uv run python -m invoke deploy-oat --host 127.0.0.1

  unit-tests:
    name: Run unit tests
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        env:
          WINEBOX_USE_CLAUDE_VISION: "true"
          WINEBOX_ANTHROPIC_API_KEY: ${{ secrets.WINEBOX_ANTHROPIC_API_KEY }}
        run: |
          uv run python -m pytest -m "not e2e" -v

  # E2E runs on the self-hosted runner that lives on the OAT droplet so
  # the test process talks to the deployed app over loopback. The OAT
  # cloud firewall keeps :443 closed to public traffic; trying to run
  # E2E from a GitHub-hosted Azure runner times out at TCP. localhost
  # always works.
  e2e-tests:
    name: Run full E2E suite against OAT (loopback)
    needs: deploy
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: [self-hosted, oat]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tests_passed: ${{ steps.e2e.outcome == 'success' }}
      test_output: ${{ steps.e2e.outputs.test_output }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "WineBox Nightly Bot"
          git config user.email "nightly-bot@winebox.app"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Free disk before Playwright install
        # Idempotent cleanup of safely-recoverable cruft. ~600 MB freed
        # on the first run, near no-op after.
        #
        # NOT included (intentionally — see commit history):
        #   /opt/github-runner/externals.* — superseded runner version
        #   dirs are hard-linked into the canonical `externals/` tree
        #   the agent uses; `rm -rf` of any one drops the link count
        #   on shared inodes and breaks node20 for every subsequent
        #   job. Cleanup of those has to happen via the runner's own
        #   reinstall script, not from inside a CI step.
        run: |
          set +e
          echo "=== df -h before ==="
          df -h /

          # The runner-install bootstrap tarball is unpacked once and
          # never read again — only the unpacked tree (which we
          # explicitly DO NOT touch) is load-bearing.
          rm -f /opt/github-runner/actions-runner-linux-x64-*.tar.gz

          # uv/pip wheel cache (regenerated on demand, no app state).
          rm -rf /opt/winebox/.cache

          # X-Wines source zips (post-ingest dead weight; the unzipped
          # tree next to them is what oat-deploy-xwines reads).
          rm -f /opt/winebox/data/xwines/X-Wines_Official_Repository/last/*.zip

          # Stale Playwright cache from a failed previous install.
          rm -rf ~/.cache/ms-playwright

          echo "=== df -h after ==="
          df -h /
          true

      - name: Install Playwright browser binary
        # Plain binary download into ~/.cache/ms-playwright. No apt.
        run: uv run playwright install chromium

      - name: Install Playwright system deps (apt, retry on lock)
        # Chromium needs libnss3 / libatk-bridge2.0-0 / libxcomposite /
        # etc. `playwright install-deps` shells out to apt-get install
        # which can contend with the droplet's unattended-upgrades cron
        # for /var/lib/apt/lists/lock. Capture stdout+stderr so a
        # genuine package-resolution failure isn't masked as "apt
        # locked" by the retry loop.
        run: |
          set +e
          LOG=$(mktemp)
          for i in $(seq 1 12); do
            uv run playwright install-deps chromium >"$LOG" 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "Playwright deps installed on attempt $i."
              rm -f "$LOG"
              exit 0
            fi
            echo "=== attempt $i failed (rc=$rc), output: ==="
            cat "$LOG"
            echo "=== sleeping 10 s ==="
            sleep 10
          done
          echo "Playwright deps install never succeeded after 12 attempts." >&2
          echo "=== last attempt's output: ===" >&2
          cat "$LOG" >&2
          rm -f "$LOG"
          exit 1

      - name: Run full E2E tests against OAT
        id: e2e
        continue-on-error: true
        env:
          WINEBOX_TEST_URL: "http://localhost:8000"
          WINEBOX_MONGODB_URL: ${{ secrets.WINEBOX_OAT_MONGODB_URL }}
          WINEBOX_DATABASE: "winebox_oat"
          WINEBOX_SECRET_KEY: ${{ secrets.WINEBOX_SECRET_KEY }}
          WINEBOX_ANTHROPIC_API_KEY: ${{ secrets.WINEBOX_ANTHROPIC_API_KEY }}
          WINEBOX_USE_CLAUDE_VISION: "true"
          WINEBOX_TEST_USER: ""
          WINEBOX_TEST_PASSWORD: ""
        run: |
          set -o pipefail
          uv run python -m pytest -c pytest-e2e.ini \
            tests/test_app_navigation_e2e.py \
            tests/test_cellar_e2e.py \
            tests/test_cellar_tabs_e2e.py \
            tests/test_case_actions_e2e.py \
            tests/test_checkout_e2e.py \
            tests/test_export_e2e.py \
            tests/test_history_e2e.py \
            tests/test_search_e2e.py \
            tests/test_search_filters_e2e.py \
            tests/test_settings_e2e.py \
            tests/test_registration_e2e.py \
            tests/test_undo_import_e2e.py \
            tests/test_wine_detail_e2e.py \
            tests/test_checkin_e2e.py \
            tests/test_demo_e2e.py \
            tests/test_xwines_e2e.py \
            tests/test_import_e2e.py \
            tests/test_import_xwines_e2e.py \
            -n 2 -v 2>&1 | tee /tmp/e2e-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: /tmp/e2e-results.txt

      - name: Check test results
        if: steps.e2e.outcome == 'success'
        run: echo "All E2E tests passed"

  auto-fix:
    name: Auto-fix failing tests with Claude Code
    needs: e2e-tests
    if: needs.e2e-tests.outputs.tests_passed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: /tmp

      - name: Extract failure summary
        id: failures
        run: |
          FAILURES=$(grep "FAILED" /tmp/e2e-results.txt | head -20 || echo "No specific failures found")
          echo "failures<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FAILURES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to fix failures
        id: claude_fix
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.WINEBOX_ANTHROPIC_API_KEY }}
          prompt: |
            The nightly E2E tests against OAT failed. Here are the failures:

            ${{ steps.failures.outputs.failures }}

            Full test output is in /tmp/e2e-results.txt.

            Diagnose the failures, fix the code, and commit the fix to a new branch.
            Create the branch as `fix/nightly-$(date +%Y%m%d)`.
            Only fix test failures — do not refactor or add features.
            Run the unit tests to verify the fix doesn't break anything.
          allowed_tools: "Bash,Read,Write,Edit,Grep,Glob"

      - name: Create PR if fix was committed
        if: steps.claude_fix.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="fix/nightly-$(date +%Y%m%d)"
          if git diff --quiet HEAD origin/main 2>/dev/null; then
            echo "No changes to commit"
            exit 0
          fi
          git push origin HEAD:$BRANCH
          gh pr create \
            --base main \
            --head $BRANCH \
            --title "fix: Nightly auto-fix for E2E test failures ($(date +%Y-%m-%d))" \
            --body "$(cat <<'BODY'
          ## Nightly Auto-Fix

          The nightly E2E tests failed and Claude Code attempted an automatic fix.

          ### Failures detected:
          ${{ steps.failures.outputs.failures }}

          ### Review checklist:
          - [ ] Changes look correct
          - [ ] CI passes on this PR
          - [ ] No unintended side effects

          🤖 Generated by the nightly CI pipeline
          BODY
          )"

  create-issue:
    name: Create issue for unresolved failures
    needs: [e2e-tests, auto-fix]
    if: |
      always() &&
      needs.e2e-tests.outputs.tests_passed == 'false' &&
      (needs.auto-fix.result == 'failure' || needs.auto-fix.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: /tmp

      - name: Create GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES=$(grep "FAILED" /tmp/e2e-results.txt | head -20 || echo "See attached test output")
          SUMMARY=$(tail -5 /tmp/e2e-results.txt)

          gh issue create \
            --title "Nightly E2E failures ($(date +%Y-%m-%d)) — auto-fix failed" \
            --label "bug,nightly" \
            --body "$(cat <<BODY
          ## Nightly E2E Test Failures

          The nightly deploy and test run found failures that could not be automatically fixed.

          ### Test Summary
          \`\`\`
          $SUMMARY
          \`\`\`

          ### Failed Tests
          \`\`\`
          $FAILURES
          \`\`\`

          ### Actions
          - Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full details
          - Download the test results artifact for complete output

          🤖 Created automatically by the nightly CI pipeline
          BODY
          )"
