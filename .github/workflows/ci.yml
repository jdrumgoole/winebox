name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} (unit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests (exclude E2E)
        env:
          WINEBOX_USE_CLAUDE_VISION: "false"
        run: uv run python -m pytest -v -m "not e2e"

  # NB: per-commit Playwright E2E against OAT was removed on 2026-04-19.
  # GitHub Actions cloud runners (`ubuntu-latest`) consistently time out
  # reaching https://oat.winebox.app, even though OAT is healthy and
  # answers local curl in ~300ms. The nightly workflow runs the full
  # E2E suite against OAT using a self-hosted runner that lives on the
  # droplet itself (loopback path), so coverage is preserved there.
  # If we want this back on per-commit CI the clean fix is to also
  # move it to `runs-on: [self-hosted, oat]` with WINEBOX_TEST_URL
  # pointing at localhost:8000 — not blocked on server reachability.

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check import sorting with isort
        run: uv run pip install isort && uv run isort --check-only --diff winebox tests
        continue-on-error: true

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
