name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ubuntu:
    name: Test Python 3.11 (Ubuntu, unit)
    runs-on: ubuntu-latest

    # MongoDB on Linux is a Docker `services:` container — same as before.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests (exclude E2E)
        env:
          WINEBOX_USE_CLAUDE_VISION: "false"
        run: uv run python -m pytest -v -m "not e2e"

  test-macos:
    name: Test Python 3.11 (macOS, unit)
    runs-on: macos-latest

    # macOS GHA runners don't support `services:` (no Docker). Install
    # MongoDB and Tesseract via Homebrew instead, then start the
    # daemon as a background service so the test suite finds it at
    # the same localhost:27017 the Linux job expects.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR (Homebrew)
        run: brew install tesseract

      - name: Install MongoDB (Homebrew)
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0
          brew services start mongodb-community@7.0
          # Wait for mongod to accept connections — brew services is
          # async and tests fail-fast on connection refused.
          for i in $(seq 1 30); do
            if nc -z localhost 27017; then exit 0; fi
            sleep 1
          done
          echo "MongoDB did not come up on localhost:27017 in 30s" >&2
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests (exclude E2E)
        env:
          WINEBOX_USE_CLAUDE_VISION: "false"
        run: uv run python -m pytest -v -m "not e2e"

  # NB: per-commit Playwright E2E against OAT was removed on 2026-04-19.
  # GitHub Actions cloud runners (`ubuntu-latest`) consistently time out
  # reaching https://oat.winebox.app, even though OAT is healthy and
  # answers local curl in ~300ms. The nightly workflow runs the full
  # E2E suite against OAT using a self-hosted runner that lives on the
  # droplet itself (loopback path), so coverage is preserved there.
  # If we want this back on per-commit CI the clean fix is to also
  # move it to `runs-on: [self-hosted, oat]` with WINEBOX_TEST_URL
  # pointing at localhost:8000 — not blocked on server reachability.

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check import sorting with isort
        run: uv run pip install isort && uv run isort --check-only --diff winebox tests
        continue-on-error: true

      - name: Lint static assets (CSP — no inline scripts / onclick handlers)
        run: uv run python scripts/lint_static_assets.py

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
