<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG Image Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body {
    margin: 40px;
    background: #ccc;
    font-family: sans-serif;
  }
  h2 { margin-bottom: 10px; }
  p { color: #666; margin-bottom: 20px; }
  .frame {
    width: 1200px;
    height: 627px;
    background: #FAF7F2;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 20px rgba(0,0,0,0.2);
  }
  .logo-group {
    text-align: left;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .icon svg {
    width: 160px;
    height: 160px;
  }
  .text-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .wordmark {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 96px;
    letter-spacing: -2px;
    line-height: 1;
  }
  .wordmark .wine { font-weight: 700; color: #5C0A2D; }
  .wordmark .box  { font-weight: 400; color: #C49A3C; }
  .tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #8A7A80;
    margin-top: 4px;
  }

  /* LinkedIn preview simulation */
  .linkedin-sim {
    margin-top: 40px;
    width: 552px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: white;
  }
  .linkedin-sim img {
    width: 100%;
    display: block;
  }
  .linkedin-sim .meta {
    padding: 12px 16px;
    border-top: 1px solid #eee;
  }
  .linkedin-sim .meta h3 { font-size: 14px; margin: 0; }
  .linkedin-sim .meta span { font-size: 12px; color: #999; }

  #capture-btn {
    margin-top: 20px;
    padding: 12px 24px;
    background: #5C0A2D;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>OG Image Preview (1200 x 627)</h2>
<p>This is exactly what will be rendered as the OG image. Adjust until happy, then capture.</p>

<div class="frame" id="og-frame">
  <div class="logo-group">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <rect x="4" y="40" width="92" height="56" rx="4" fill="#B8956A" stroke="#8A6C4E" stroke-width="1.5"/>
        <line x1="4" y1="55" x2="96" y2="55" stroke="#907050" stroke-width="0.7" opacity="0.5"/>
        <line x1="4" y1="70" x2="96" y2="70" stroke="#907050" stroke-width="0.7" opacity="0.5"/>
        <line x1="35" y1="44" x2="35" y2="92" stroke="#8A6C4E" stroke-width="1" opacity="0.45"/>
        <line x1="65" y1="44" x2="65" y2="92" stroke="#8A6C4E" stroke-width="1" opacity="0.45"/>
        <path d="M12 72 L12 38 L12 33 Q12 29 16 27 L16 14 Q16 11 17.5 10.5 L22.5 10.5 Q24 11 24 14 L24 27 Q28 29 28 33 L28 38 L28 72 Z" fill="#B82860"/>
        <rect x="13.5" y="44" width="13" height="14" rx="1" fill="#F0D78C" opacity="0.45"/>
        <path d="M42 72 L42 34 Q42 27 46 23 L46 10 Q46 7 47.5 6.5 L52.5 6.5 Q54 7 54 10 L54 23 Q58 27 58 34 L58 72 Z" fill="#B82860"/>
        <rect x="43.5" y="38" width="13" height="14" rx="1" fill="#F0D78C" opacity="0.45"/>
        <path d="M72 72 L72 40 L72 35 Q72 31 76 29 L76 16 Q76 13 77.5 12.5 L82.5 12.5 Q84 13 84 16 L84 29 Q88 31 88 35 L88 40 L88 72 Z" fill="#B82860"/>
        <rect x="73.5" y="46" width="13" height="14" rx="1" fill="#F0D78C" opacity="0.45"/>
      </svg>
    </div>
    <div class="text-group">
      <div class="wordmark"><span class="wine">Wine</span><span class="box">Box</span></div>
      <div class="tagline">Your Cellar, Curated</div>
    </div>
  </div>
</div>

<button id="capture-btn" onclick="captureOG()">Capture as PNG</button>

<h2 style="margin-top: 40px;">LinkedIn Preview Simulation</h2>
<p>Approximate how it will look in a LinkedIn feed post.</p>
<div class="linkedin-sim">
  <img id="linkedin-preview" src="" alt="Preview will appear after capture">
  <div class="meta">
    <h3>WineBox - Smart Wine Cellar Management</h3>
    <span>winebox.app</span>
  </div>
</div>

<script>
async function captureOG() {
  // Use html2canvas if available, otherwise instruct user
  const frame = document.getElementById('og-frame');
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 1200;
    canvas.height = 627;
    // Simple: take a screenshot via the download trick
    const dataUrl = await domToImage(frame);
    document.getElementById('linkedin-preview').src = dataUrl;

    // Trigger download
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'og-preview.png';
    a.click();
  } catch(e) {
    alert('To capture: right-click the preview above → Inspect → select the .frame div → screenshot node in DevTools (or use shot-scraper)');
  }
}

// Minimal dom-to-image using SVG foreignObject
async function domToImage(node) {
  const {width, height} = node.getBoundingClientRect();
  const clone = node.cloneNode(true);
  clone.style.width = width + 'px';
  clone.style.height = height + 'px';

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
    <foreignObject width="100%" height="100%">
      <div xmlns="http://www.w3.org/1999/xhtml">${clone.outerHTML}</div>
    </foreignObject>
  </svg>`;

  const img = new window.Image();
  img.width = width;
  img.height = height;

  return new Promise((resolve) => {
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = width * 2;
      canvas.height = height * 2;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
  });
}
</script>
</body>
</html>
